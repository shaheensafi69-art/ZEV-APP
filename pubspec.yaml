name: zev_app
description: "ZEV - The Next Generation Social Network (zevapp.com)"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.16.0
  app_links: ^6.3.3
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  file_picker: ^11.0.3
  local_auth: ^3.0.1
  device_info_plus: ^11.2.0
  dio: ^5.4.0
  http: ^1.2.0
  crypto: ^3.0.3
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  dropdown_search: ^7.0.0
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.3
  video_player: ^2.9.2
  audioplayers: ^6.0.0
  flutter_tts: ^4.2.1
  speech_to_text: ^7.4.0

  collection: any
  gal: ^2.3.3
  google_mobile_ads: ^5.2.0
  easy_compressor:
    path: packages/easy_compressor
  video_watermark_plus: ^1.2.0
  cached_network_image: ^3.4.1
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/
    - assets/icon/

flutter_launcher_icons:
  image_path: "assets/icon/icon-1024x1024.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/icon-512x512.png"

